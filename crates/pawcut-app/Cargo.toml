[package]
name = "pawcut-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pawcut"
path = "src/main.rs"

[dependencies]
pawcut-core.workspace = true
pawcut-media.workspace = true
pawcut-render.workspace = true
pawcut-export.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
eframe = "0.36"
egui = { version = "0.36", features = ["serde"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[dev-dependencies]
tempfile.workspace = true
