[package]
name = "pawvoice-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pawvoice"
path = "src/main.rs"

[dependencies]
pawvoice-core.workspace = true
paw-audio.workspace = true
paw-ui.workspace = true
paw-media.workspace = true
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
rustfft = "6"
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { version = "0.36", features = ["eframe"] }
