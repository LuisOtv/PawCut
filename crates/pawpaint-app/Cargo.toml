[package]
name = "pawpaint-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pawpaint"
path = "src/main.rs"

[dependencies]
pawpaint-core.workspace = true
paw-ui.workspace = true
eframe = "0.36"
egui = { version = "0.36", features = ["serde"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
tempfile.workspace = true
