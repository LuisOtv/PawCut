# O libclang desta máquina não traz os próprios headers (falta o pacote libclang-dev),
# então o bindgen do ffmpeg-sys-next usa os headers internos do GCC.
# Depois de `sudo apt install libclang-dev` esta linha pode sair.
[env]
BINDGEN_EXTRA_CLANG_ARGS = "-I/usr/lib/gcc/x86_64-linux-gnu/15/include"
